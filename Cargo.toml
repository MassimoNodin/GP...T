[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
f1-wire = { path = "crates/f1-wire" }
f1-format = { path = "crates/f1-format" }
f1-pipeline = { path = "crates/f1-pipeline" }
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
ctrlc = { version = "3", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
