[Unit]
ConditionPathIsMountPoint=/mnt/nvme
ConditionPathIsDirectory=/mnt/nvme/f1-engineer/data

[Service]
ExecStart=
ExecStart=%h/GP...T/.venv/bin/f1-engineer api --require-auth --database /mnt/nvme/f1-engineer/data/f1-engineer.sqlite3 --recordings-root /mnt/nvme/f1-engineer/recordings --control-token-file %h/GP...T/data/.f1-engineer-control-token
