[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-race-engineer"
version = "0.1.0"
description = "A local-first telemetry foundation for an AI F1 race engineer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=25,<26",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3,<9",
]
app = [
    "fastapi>=0.142,<1",
    "httpx>=0.28.1,<1",
    "uvicorn>=0.54,<1",
]

[project.scripts]
f1-engineer = "f1_engineer.cli:main"

[tool.setuptools.packages.find]
include = ["f1_engineer*"]

[tool.setuptools.package-data]
f1_engineer = ["tracks/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
